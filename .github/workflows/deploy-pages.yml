name: Deploy GitHub Pages

# Secret refresh redeploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY is not configured."
            exit 1
          fi

          case "$GOOGLE_MAPS_API_KEY" in
            AIza*) ;;
            *)
              echo "GOOGLE_MAPS_API_KEY does not look like a valid Google API key."
              exit 1
              ;;
          esac

          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("_site/business/index.html")
          text = path.read_text(encoding="utf-8")
          marker = "__GOOGLE_MAPS_API_KEY__"
          if marker not in text:
              raise SystemExit("Google Maps API key placeholder was not found.")

          key = os.environ["GOOGLE_MAPS_API_KEY"]
          path.write_text(text.replace(marker, key), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
