<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拓勇会衆 区域地図 試用版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #222;
    }
    header {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
    }
    .controls {
      padding: 10px 12px;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    .area-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .area-selector label {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
    .area-selector select {
      min-width: 150px;
      max-width: 240px;
      padding: 8px 36px 8px 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 15px;
    }
    .toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .shared-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .shared-controls button {
      border: 1px solid #bbb;
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .shared-controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .shared-controls button.active {
      background: #e8f5e9;
      border-color: #2e7d32;
      font-weight: 700;
    }
    #firebaseStatus {
      font-size: 13px;
      color: #555;
    }
    #map {
      width: 100%;
      height: calc(100vh - 205px);
      min-height: 500px;
    }
    .note {
      padding: 10px 12px;
      font-size: 13px;
      color: #555;
      background: #fff8e6;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <header>
    <h1>拓勇会衆 区域地図（試用版・やや拡大表示）</h1>
  </header>

  <div class="controls">
    <div class="area-selector">
      <label for="areaSelect">区域を選択：</label>
      <select id="areaSelect" aria-label="区域番号を選択">
        <option value="">区域を選択してください</option>
      </select>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="toggleAreas" checked> 区域境界</label>
      <label><input type="checkbox" id="toggleNumbers" checked> 区域番号</label>
      <label><input type="checkbox" id="toggleNoVisit" checked> 訪問しない場所</label>
      <label><input type="checkbox" id="toggleVisited" checked> 共有記録</label>
    </div>
    <div class="shared-controls">
      <button type="button" id="addModeBtn" disabled>記録を追加</button>
      <button type="button" id="clearAreaBtn" disabled>この区域の共有印を全部消す</button>
      <span id="firebaseStatus">区域データを読み込んでいます…</span>
    </div>
  </div>

  <div id="map"></div>

  <div class="note">
    プルダウンで区域番号を選ぶと、その区域へ移動し、区域内が薄い青で表示されます。
    ①区域番号を選択 → ②「記録を追加」→ ③「追加モード中」になったら家の位置をタップ →
    ④「会えた（青✓）」「再訪問（緑✓）」「訪問拒否（赤✓）」から選択します。
    登録した印はFirestore経由で他端末にもリアルタイム共有されます。
    区域境界は <strong>takuyu_areas.geojson</strong> から自動で読み込みます。
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc,
      serverTimestamp, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // 既存の「訪問しない場所」はそのまま残しています。
    const NO_VISIT = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.6814669,42.6799743]}},{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.683903,42.6778268]}},{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.6829364,42.6777238]}},{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.6847693,42.6745184]}},{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.6849638,42.6752182]}},{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.684371,42.6760445]}},{"type":"Feature","properties":{"name":"拒否","layer":"訪問拒否","type":"no_visit"},"geometry":{"type":"Point","coordinates":[141.6845176,42.6772654]}}]};

    const firebaseConfig = {
      "apiKey": "AIzaSyAsWJ8uw9RzUQ3nt39Y4Jvru7l838IJ1E4",
      "authDomain": "takuyu-map.firebaseapp.com",
      "projectId": "takuyu-map",
      "storageBucket": "takuyu-map.firebasestorage.app",
      "messagingSenderId": "1045163180802",
      "appId": "1:1045163180802:web:f36a869d9b73a03bfb781b"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    // 現在使っているGoogle Maps APIキーをそのまま引き継いでいます。
    const GOOGLE_MAPS_API_KEY = "AIzaSyCF3tnGpjMfXsPtWGMKmofSxb4AECKB-J0";
    const AREAS_GEOJSON_URL = "./takuyu_areas.geojson";

    let map;
    let areaLayer;
    let numberLayer;
    let noVisitLayer;
    let visitedLayer;
    let infoWindow;
    let activeAreaNo = null;
    let addMode = false;
    let currentUser = null;
    let unsubscribeVisited = null;
    const areaCenters = {};
    const areaNumbers = [];

    function makeNumberIcon(text) {
      const safe = String(text).replace(/[&<>"']/g, "");
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="19" fill="#ffffff" stroke="#1565c0" stroke-width="4"/>
          <text x="22" y="27" text-anchor="middle"
                font-family="Arial, sans-serif" font-size="15" font-weight="700"
                fill="#1565c0">${safe}</text>
        </svg>`;
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(44, 44),
        anchor: new google.maps.Point(22, 22)
      };
    }

    function makeNoVisitIcon() {
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
          <circle cx="17" cy="17" r="14" fill="#ffffff" stroke="#c62828" stroke-width="4"/>
          <path d="M10 10 L24 24 M24 10 L10 24" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
        </svg>`;
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(34, 34),
        anchor: new google.maps.Point(17, 17)
      };
    }

    function makeSharedIcon(status) {
      const colors = {
        met: "#1976d2",
        revisit: "#2e7d32",
        refuse: "#c62828"
      };
      const color = colors[status] || colors.met;
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
          <circle cx="17" cy="17" r="13" fill="#ffffff" stroke="${color}" stroke-width="4"/>
          <path d="M9.5 17 L14.5 22 L24.5 11.5"
                fill="none" stroke="${color}" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(34, 34),
        anchor: new google.maps.Point(17, 17)
      };
    }

    function setStatus(text) {
      const el = document.getElementById("firebaseStatus");
      if (el) el.textContent = text;
    }

    function areaNoFromFeature(feature) {
      return String(feature.getProperty("area_no") || feature.getProperty("name") || "").trim();
    }

    function naturalAreaSort(a, b) {
      return String(a).localeCompare(String(b), "ja", { numeric: true, sensitivity: "base" });
    }

    async function loadAreaGeoJson() {
      const response = await fetch(AREAS_GEOJSON_URL, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`区域GeoJSONを取得できませんでした（HTTP ${response.status}）`);
      }
      const geojson = await response.json();
      if (!geojson || geojson.type !== "FeatureCollection" || !Array.isArray(geojson.features)) {
        throw new Error("takuyu_areas.geojson の形式を確認してください。FeatureCollectionではありません。");
      }
      areaLayer.addGeoJson(geojson);
      buildAreaIndexAndNumbers();
    }

    function buildAreaIndexAndNumbers() {
      const boundsByArea = new Map();

      areaLayer.forEach(feature => {
        const no = areaNoFromFeature(feature);
        if (!no) return;

        if (!boundsByArea.has(no)) {
          boundsByArea.set(no, new google.maps.LatLngBounds());
        }
        const bounds = boundsByArea.get(no);
        const geometry = feature.getGeometry();
        if (!geometry) return;
        geometry.forEachLatLng(latLng => bounds.extend(latLng));
      });

      areaNumbers.length = 0;
      Object.keys(areaCenters).forEach(key => delete areaCenters[key]);

      [...boundsByArea.keys()].sort(naturalAreaSort).forEach(no => {
        const bounds = boundsByArea.get(no);
        if (!bounds || bounds.isEmpty()) return;
        const center = bounds.getCenter();
        areaCenters[no] = { lat: center.lat(), lng: center.lng() };
        areaNumbers.push(no);
        numberLayer.add({
          geometry: new google.maps.Data.Point(center),
          properties: { area_no: no, name: no }
        });
      });
    }

    async function startFirebase() {
      try {
        await signInAnonymously(auth);
        onAuthStateChanged(auth, user => {
          currentUser = user || null;
          if (currentUser) {
            setStatus(`共有機能：接続済み／区域データ ${areaNumbers.length}件`);
            document.getElementById("addModeBtn").disabled = false;
            document.getElementById("clearAreaBtn").disabled = !activeAreaNo;
            subscribeVisitedHomes();
          } else {
            setStatus("共有機能：未接続");
          }
        });
      } catch (err) {
        console.error(err);
        setStatus("Firebase接続エラー：" + (err.code || err.message));
      }
    }

    function subscribeVisitedHomes() {
      if (unsubscribeVisited) unsubscribeVisited();
      unsubscribeVisited = onSnapshot(collection(db, "visitedHomes"), snapshot => {
        if (!visitedLayer) return;
        const existing = [];
        visitedLayer.forEach(feature => existing.push(feature));
        existing.forEach(feature => visitedLayer.remove(feature));

        snapshot.forEach(d => {
          const data = d.data();
          if (typeof data.lat !== "number" || typeof data.lng !== "number") return;
          visitedLayer.add({
            id: d.id,
            geometry: new google.maps.Data.Point({ lat: data.lat, lng: data.lng }),
            properties: {
              docId: d.id,
              areaNo: String(data.areaNo || ""),
              status: String(data.status || "met"),
              createdBy: data.createdBy || ""
            }
          });
        });
      }, err => {
        console.error(err);
        setStatus("共有データ読込エラー：" + (err.code || err.message));
      });
    }

    async function addSharedMark(latLng, status) {
      if (!currentUser || !activeAreaNo) return;
      try {
        await addDoc(collection(db, "visitedHomes"), {
          areaNo: String(activeAreaNo),
          lat: latLng.lat(),
          lng: latLng.lng(),
          status: String(status || "met"),
          createdAt: serverTimestamp(),
          createdBy: currentUser.uid
        });
        addMode = false;
        updateAddModeButton();
        if (map) map.setOptions({ draggableCursor: null });
      } catch (err) {
        console.error(err);
        alert("登録できませんでした：" + (err.code || err.message));
      }
    }

    async function removeSharedMark(docId) {
      if (!currentUser || !docId) return;
      try {
        await deleteDoc(doc(db, "visitedHomes", docId));
        infoWindow.close();
      } catch (err) {
        console.error(err);
        alert("削除できませんでした：" + (err.code || err.message));
      }
    }

    async function clearActiveAreaVisited() {
      if (!currentUser || !activeAreaNo) return;
      if (!confirm(`区域${activeAreaNo}の共有印をすべて削除しますか？`)) return;
      try {
        const q = query(collection(db, "visitedHomes"), where("areaNo", "==", String(activeAreaNo)));
        const snap = await getDocs(q);
        await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "visitedHomes", d.id))));
      } catch (err) {
        console.error(err);
        alert("一括削除できませんでした：" + (err.code || err.message));
      }
    }

    function updateAddModeButton() {
      const btn = document.getElementById("addModeBtn");
      if (!btn) return;
      btn.classList.toggle("active", addMode);
      btn.textContent = addMode ? "追加モード中：場所をタップ" : "記録を追加";
    }

    async function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 42.65, lng: 141.65 },
        zoom: 13,
        mapTypeControl: true,
        streetViewControl: false,
        fullscreenControl: true
      });

      areaLayer = new google.maps.Data();
      numberLayer = new google.maps.Data();
      noVisitLayer = new google.maps.Data();
      visitedLayer = new google.maps.Data();
      infoWindow = new google.maps.InfoWindow();

      noVisitLayer.addGeoJson(NO_VISIT);

      areaLayer.setStyle(feature => {
        const no = areaNoFromFeature(feature);
        const selected = activeAreaNo && no === String(activeAreaNo);
        return {
          strokeColor: selected ? "#1976d2" : "#333333",
          strokeWeight: selected ? 5 : 4,
          strokeOpacity: 0.95,
          fillColor: selected ? "#1976d2" : "#ffffff",
          fillOpacity: selected ? 0.07 : 0.02,
          clickable: false
        };
      });

      numberLayer.setStyle(feature => {
        const label = areaNoFromFeature(feature);
        return {
          icon: makeNumberIcon(label),
          clickable: false
        };
      });

      noVisitLayer.setStyle({ icon: makeNoVisitIcon() });

      visitedLayer.setStyle(feature => {
        const status = String(feature.getProperty("status") || "met");
        return { icon: makeSharedIcon(status) };
      });

      areaLayer.setMap(map);
      numberLayer.setMap(map);
      noVisitLayer.setMap(map);
      visitedLayer.setMap(map);

      try {
        await loadAreaGeoJson();
        makeAreaButtons();
        fitAllAreas();
        setStatus(`区域データ ${areaNumbers.length}件を読み込みました／共有機能に接続しています…`);
      } catch (err) {
        console.error(err);
        setStatus("区域データ読込エラー：" + err.message);
        alert("区域境界を読み込めませんでした。takuyu_areas.geojson が index.html と同じ場所にあるか確認してください。\n\n" + err.message);
      }

      document.getElementById("toggleAreas").addEventListener("change", e => {
        areaLayer.setMap(e.target.checked ? map : null);
      });
      document.getElementById("toggleNumbers").addEventListener("change", e => {
        numberLayer.setMap(e.target.checked ? map : null);
      });
      document.getElementById("toggleNoVisit").addEventListener("change", e => {
        noVisitLayer.setMap(e.target.checked ? map : null);
      });
      document.getElementById("toggleVisited").addEventListener("change", e => {
        visitedLayer.setMap(e.target.checked ? map : null);
      });

      document.getElementById("addModeBtn").addEventListener("click", () => {
        if (!activeAreaNo) {
          alert("先に区域番号を選択してください。");
          return;
        }
        addMode = !addMode;
        updateAddModeButton();
        map.setOptions({ draggableCursor: addMode ? "crosshair" : null });
      });

      document.getElementById("clearAreaBtn").addEventListener("click", clearActiveAreaVisited);

      map.addListener("click", e => {
        if (!addMode || !activeAreaNo || !e.latLng) return;

        const wrap = document.createElement("div");
        const message = document.createElement("div");
        message.textContent = `区域${activeAreaNo}：この場所の記録を選んでください`;
        message.style.marginBottom = "10px";
        wrap.appendChild(message);

        const choices = [
          { label: "会えた", status: "met", color: "#1976d2" },
          { label: "再訪問", status: "revisit", color: "#2e7d32" },
          { label: "訪問拒否", status: "refuse", color: "#c62828" }
        ];

        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.flexWrap = "wrap";
        row.style.gap = "7px";

        choices.forEach(choice => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = choice.label;
          btn.style.padding = "8px 12px";
          btn.style.border = `2px solid ${choice.color}`;
          btn.style.color = choice.color;
          btn.style.background = "#fff";
          btn.style.borderRadius = "8px";
          btn.style.fontWeight = "700";
          btn.addEventListener("click", async () => {
            infoWindow.close();
            await addSharedMark(e.latLng, choice.status);
          });
          row.appendChild(btn);
        });

        wrap.appendChild(row);
        infoWindow.setContent(wrap);
        infoWindow.setPosition(e.latLng);
        infoWindow.open({ map });
      });

      visitedLayer.addListener("click", e => {
        const docId = e.feature.getProperty("docId");
        const areaNo = e.feature.getProperty("areaNo");
        const status = String(e.feature.getProperty("status") || "met");

        const labels = {
          met: "会えた",
          revisit: "再訪問",
          refuse: "訪問拒否"
        };

        const wrap = document.createElement("div");
        const message = document.createElement("div");
        message.textContent = `区域${areaNo}：${labels[status] || "会えた"}`;
        message.style.marginBottom = "8px";

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.textContent = "この印を消す";
        delBtn.style.padding = "7px 12px";
        delBtn.addEventListener("click", () => removeSharedMark(docId));

        wrap.appendChild(message);
        wrap.appendChild(delBtn);
        infoWindow.setContent(wrap);
        infoWindow.setPosition(e.latLng);
        infoWindow.open({ map });
      });

      startFirebase();
    }

    function makeAreaButtons() {
      const select = document.getElementById("areaSelect");
      select.innerHTML = '<option value="">区域を選択してください</option>';

      areaNumbers.forEach(no => {
        const option = document.createElement("option");
        option.value = String(no);
        option.textContent = "区域 " + no;
        select.appendChild(option);
      });

      select.addEventListener("change", e => {
        if (e.target.value) focusArea(e.target.value);
      });
    }

    function focusArea(areaNo) {
      const select = document.getElementById("areaSelect");
      if (select) select.value = String(areaNo);

      activeAreaNo = String(areaNo);

      areaLayer.setStyle(feature => {
        const no = areaNoFromFeature(feature);
        const selected = no === String(activeAreaNo);
        return {
          strokeColor: selected ? "#1976d2" : "#333333",
          strokeWeight: selected ? 5 : 4,
          strokeOpacity: 0.95,
          fillColor: selected ? "#1976d2" : "#ffffff",
          fillOpacity: selected ? 0.07 : 0.02,
          clickable: false
        };
      });

      document.getElementById("clearAreaBtn").disabled = !currentUser;
      addMode = false;
      updateAddModeButton();
      if (currentUser) setStatus(`共有機能：接続済み／区域${activeAreaNo}を選択中`);

      const bounds = new google.maps.LatLngBounds();
      let found = false;

      areaLayer.forEach(feature => {
        const no = areaNoFromFeature(feature);
        if (no !== String(areaNo)) return;
        const geometry = feature.getGeometry();
        if (!geometry) return;
        geometry.forEachLatLng(latLng => {
          bounds.extend(latLng);
          found = true;
        });
      });

      if (found) {
        map.fitBounds(bounds, 45);
        google.maps.event.addListenerOnce(map, "idle", () => {
          const currentZoom = map.getZoom() || 17;
          map.setZoom(Math.min(currentZoom + 1, 18));
        });
      } else if (areaCenters[areaNo]) {
        map.setCenter(areaCenters[areaNo]);
        map.setZoom(18);
      }
    }

    function fitAllAreas() {
      const bounds = new google.maps.LatLngBounds();
      let found = false;
      areaLayer.forEach(feature => {
        const geometry = feature.getGeometry();
        if (!geometry) return;
        geometry.forEachLatLng(latLng => {
          bounds.extend(latLng);
          found = true;
        });
      });
      if (found) map.fitBounds(bounds, 40);
    }

    window.initMap = initMap;

    function loadGoogleMaps() {
      if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === "YOUR_DEMO_KEY") {
        const mapEl = document.getElementById("map");
        mapEl.innerHTML =
          '<div style="padding:24px;font-size:16px;">Google Maps APIキーをHTML内の <strong>GOOGLE_MAPS_API_KEY</strong> に設定してください。</div>';
        setStatus("Google Maps APIキーが未設定です");
        return;
      }

      const script = document.createElement("script");
      script.src =
        "https://maps.googleapis.com/maps/api/js?key=" +
        encodeURIComponent(GOOGLE_MAPS_API_KEY) +
        "&callback=initMap";
      script.async = true;
      script.onerror = () => {
        setStatus("Google Mapsの読み込みに失敗しました");
        const mapEl = document.getElementById("map");
        mapEl.innerHTML =
          '<div style="padding:24px;font-size:16px;">Google Mapsを読み込めませんでした。APIキーやブラウザの開発者コンソールを確認してください。</div>';
      };
      document.head.appendChild(script);
    }

    loadGoogleMaps();
  </script>
</body>
</html>
